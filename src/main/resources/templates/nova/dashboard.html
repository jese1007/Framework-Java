<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Nova Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">
    <div class="flex h-screen">
        <div class="w-64 bg-indigo-900 text-white p-6">
            <h1 class="text-2xl font-bold mb-8">Java Nova</h1>
            <nav class="space-y-2">
                <a href="/nova/dashboard" class="block py-2 px-4 bg-indigo-800 rounded">Dashboard</a>
                <div class="pt-4 pb-2 text-xs uppercase text-indigo-300 font-semibold">Resources</div>
                <a th:each="res : ${resources}" 
                   th:href="@{'/nova/' + ${res.getEntityClass().getSimpleName().toLowerCase()}}" 
                   th:text="${res.getLabel()}"
                   class="block py-2 px-4 hover:bg-indigo-800 rounded transition">Resource</a>
            </nav>
        </div>
        <div class="flex-1 p-10">
            <h2 class="text-3xl font-bold text-gray-800 mb-6">Welcome to Nova</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div th:each="res : ${resources}" class="bg-white p-6 rounded-lg shadow-sm border border-gray-200">
                    <h3 class="text-xl font-semibold mb-2" th:text="${res.getLabel()}">Resource</h3>
                    <p class="text-gray-600 mb-4">Manage your data for this resource.</p>
                    <a th:href="@{'/nova/' + ${res.getEntityClass().getSimpleName().toLowerCase()}}" 
                       class="text-indigo-600 font-medium hover:underline">View Table &rarr;</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
