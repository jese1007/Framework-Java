<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Nova Fragments</title>
</head>
<body>
    <!-- SIDEBAR (Navigation) -->
    <div th:fragment="sidebar(activeResource)"
         class="w-64 bg-[#1e293b] text-slate-300 h-screen flex flex-col transition-all duration-300 shadow-xl z-20">

        <!-- Logo Area -->
        <div class="p-6 flex items-center space-x-3 border-b border-slate-700/50 bg-[#1a2232]">
            <div class="bg-indigo-600 p-2 rounded-lg shadow-indigo-500/20 shadow-lg">
                <i class="fa-solid fa-cube text-white text-xl"></i>
            </div>
            <span class="text-xl font-bold text-white tracking-tight">Nova Panel</span>
        </div>

        <!-- Navigation -->
        <nav class="flex-1 overflow-y-auto py-6 px-3 space-y-1">
            <div class="px-3 py-2 text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2">
                Main Menu
            </div>

            <a th:href="@{/nova/dashboard}"
               th:classappend="${activeResource == 'dashboard'} ? 'bg-indigo-600 text-white shadow-indigo-500/30 shadow-md' : 'hover:bg-slate-800 hover:text-white'"
               class="flex items-center px-3 py-2.5 rounded-lg transition-all duration-200 group">
                <i class="fa-solid fa-house mr-3 text-lg w-5 text-center"></i>
                <span class="text-sm font-medium">Dashboard</span>
            </a>

            <div class="pt-6 px-3 py-2 text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2">
                Data Management
            </div>

            <a th:each="res : ${resources}"
               th:with="resName=${res.getEntityClass().getSimpleName().toLowerCase()}"
               th:href="@{'/nova/' + ${resName}}"
               th:classappend="${activeResource == resName} ? 'bg-indigo-600 text-white shadow-indigo-500/30 shadow-md' : 'hover:bg-slate-800 hover:text-white'"
               class="flex items-center px-3 py-2.5 rounded-lg transition-all duration-200 group">
                <i class="fa-solid fa-database mr-3 text-lg w-5 text-center group-hover:text-indigo-400 transition-colors"></i>
                <span class="text-sm font-medium" th:text="${res.getLabel()}">Resource</span>
            </a>
        </nav>

        <!-- User Profile / Bottom Section -->
        <div class="p-4 border-t border-slate-700 bg-slate-900/80">
            <div class="flex items-center p-3 space-x-3 rounded-xl hover:bg-slate-800 transition cursor-pointer group">
                <div class="w-9 h-9 rounded-full bg-indigo-500 flex items-center justify-center text-white font-bold text-xs ring-2 ring-indigo-500/20">
                    AD
                </div>
                <div class="flex-1 overflow-hidden">
                    <p class="text-sm font-semibold text-white truncate group-hover:text-indigo-300 transition-colors">Administrator</p>
                    <p class="text-xs text-slate-500 truncate">admin@nova.com</p>
                </div>
                <a th:href="@{/logout}" class="text-slate-500 hover:text-red-400 transition">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </a>
            </div>
        </div>
    </div>

    <!-- HEADER -->
    <header th:fragment="header(pageTitle)" class="bg-white border-b border-gray-200 h-16 flex items-center justify-between px-8 shadow-sm z-10">
        <div class="flex items-center space-x-3 text-gray-500">
            <i class="fa-solid fa-bars text-lg cursor-pointer hover:text-indigo-600 transition"></i>
            <div class="h-4 w-px bg-gray-300"></div>
            <span class="text-sm font-semibold tracking-wide" th:text="${pageTitle}">Page Title</span>
        </div>

        <div class="flex items-center space-x-6">
            <a href="/logout" class="flex items-center space-x-2 text-sm font-medium text-gray-500 hover:text-red-600 transition">
                <i class="fa-solid fa-power-off"></i>
                <span>Logout</span>
            </a>
            <button class="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700 transition shadow-lg shadow-indigo-200 font-semibold text-sm flex items-center">
                <i class="fa-solid fa-plus mr-2"></i> New Entry
            </button>
        </div>
    </header>

    <!-- FOOTER -->
    <footer th:fragment="footer" class="bg-white border-t border-gray-200 py-6 px-8 text-center text-xs text-gray-400">
        <div class="flex flex-col items-center space-y-1">
            <span>&copy; 2026 Nova Framework - Enterprise Administration Suite</span>
            <div class="flex space-x-4">
                <a href="#" class="hover:text-indigo-500 transition">Privacy Policy</a>
                <span>&bull;</span>
                <a href="#" class="hover:text-indigo-500 transition">Terms of Service</a>
            </div>
        </div>
    </footer>
</body>
</html>
