<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
    <div class="max-w-md w-full bg-white p-8 rounded-2xl shadow-lg border border-gray-200">
        <div class="text-center mb-8">
            <div class="bg-indigo-100 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4">
                <i class="fa-solid fa-shield-halved text-indigo-600 text-2xl"></i>
            </div>
            <h2 class="text-2xl font-bold text-gray-900">Nova Framework</h2>
            <p class="text-gray-500">Please sign in to continue</p>
        </div>

        <form th:action="@{/login}" method="post" class="space-y-6">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Username</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                        <i class="fa-solid fa-user"></i>
                    </span>
                    <input type="text" name="username" required
                           class="w-full pl-10 pr-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition bg-gray-50 focus:bg-white"
                           placeholder="Enter your username">
                </div>
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                        <i class="fa-solid fa-lock"></i>
                    </span>
                    <input type="password" name="password" required
                           class="w-full pl-10 pr-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition bg-gray-50 focus:bg-white"
                           placeholder="Enter your password">
                </div>
            </div>

            <div th:if="${param.error}" class="p-3 text-sm text-red-600 bg-red-50 border border-red-200 rounded-lg">
                <i class="fa-solid fa-circle-exclamation mr-2"></i> Invalid username or password.
            </div>
            <div th:if="${param.logout}" class="p-3 text-sm text-green-600 bg-green-50 border border-green-200 rounded-lg">
                <i class="fa-solid fa-check-circle mr-2"></i> You have been logged out.
            </div>

            <button type="submit" class="w-full bg-indigo-600 text-white py-2.5 rounded-lg hover:bg-indigo-700 transition shadow-md shadow-indigo-200 font-semibold">
                Sign In
            </button>
        </form>
    </div>
</body>
</html>
